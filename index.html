<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12100c" />
    <meta name="description" content="CROWNBOUND - a tactical roguelite expedition." />
    <title>CROWNBOUND</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #12100c;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        background: #12100c;
        color: #d9b46a;
        font-family: 'Georgia', 'Times New Roman', serif;
        letter-spacing: 0.32em;
        z-index: 10;
        transition: opacity 0.35s ease;
      }
      #boot-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .title {
        font-size: clamp(22px, 6vw, 44px);
      }
      #boot-splash .sub {
        font-size: 11px;
        letter-spacing: 0.5em;
        color: #7a6a4c;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-splash">
      <div class="title">CROWNBOUND</div>
      <div class="sub">LOADING</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
